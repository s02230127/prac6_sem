[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mood-mud"
version = "0.1.0"
description = "Multi-user online dungeon client and server"
requires-python = ">=3.12"
dependencies = [
    "python-cowsay",
]

[project.scripts]
mood-client = "mood.client.__main__:main_client"
mood-server = "mood.server.__main__:main_server"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mood*"]

[tool.setuptools.package-data]
"mood.server" = [
    "locales/ru/LC_MESSAGES/*.mo",
    "custom_monsters/*.txt",
]
"mood" = [
    "docs/html/**/*",
]
